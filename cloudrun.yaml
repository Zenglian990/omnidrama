apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: omnidrama
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        # 单机内存渲染状态与本地文件系统模式下锁定 maxScale=1，避免多实例轮询脑裂
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 20
      timeoutSeconds: 600
      containers:
        - image: asia-east1-docker.pkg.dev/gen-lang-client-0742491143/cloud-run-source-deploy/omnidrama:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: PORT
              value: "8080"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OMNIDRAMA_ENV
              value: "production"
            # 部署生产时请通过 gcloud run deploy --set-env-vars 或 Secret Manager 注入：
            # - API_AUTH_TOKEN（开启全站强鉴权锁门，生产未配置将自动 Fail-Closed）
            # - OMNIDRAMA_GCS_BUCKET（可选：开启工程/视频 GCS 持久化同步）
